<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Notion Emoji Picker</title>
  <style>
    :root {
      --primary-color: #2196f3;
      --hover-color: #f5f5f7;
      --border-color: #e0e0e0;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --text-color: #37352f;
      --background-color: #ffffff;
    }
    
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .header {
      display: flex;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--background-color);
    }
    
    .header-icon {
      font-size: 20px;
      margin-right: 8px;
    }
    
    .header-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    
    .content {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      width: 100%;
      box-sizing: border-box;
    }
    
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      gap: 12px;
      justify-content: center;
    }
    
    .emoji-button {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 24px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      box-shadow: 0 1px 2px var(--shadow-color);
    }
    
    .emoji-button:hover {
      background-color: var(--hover-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px var(--shadow-color);
    }
    
    .emoji-button:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.3);
    }
    
    .footer {
      padding: 12px 16px;
      font-size: 12px;
      color: #888;
      text-align: center;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="header-icon">✨</span>
      <h1 class="header-title">Notion Emoji Picker</h1>
    </div>
    <div class="content">
      <div class="emoji-grid">
        <!-- Emojis will be added here dynamically -->
      </div>
    </div>
    <div class="footer">
      AI-powered emoji suggestions for Notion
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
