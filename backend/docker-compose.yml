version: '3.8'

services:
  notion-emoji-backend:
    image: notion-emoji-backend:latest
    platform: linux/arm64
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001"]
      interval: 30s
      timeout: 10s
      retries: 3 