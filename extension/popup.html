<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Emoji Suggester for Notion</title>
  <style>
    :root {
      --primary-color: #2196f3;
      --hover-color: #f5f5f7;
      --border-color: #e0e0e0;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --text-color: #37352f;
      --background-color: #ffffff;
      --error-color: #e53935;
    }
    
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
    }
    
    .container {
      display: flex;
      flex-direction: column;
      min-height: 320px;
    }
    
    .header {
      display: flex;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--background-color);
    }
    
    .header-icon {
      font-size: 20px;
      margin-right: 8px;
    }
    
    .header-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    
    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
    }
    
    .emoji-grid {
      display: none;
      grid-template-columns: repeat(3, 48px);
      gap: 12px;
      justify-content: center;
    }
    
    .emoji-grid.visible {
      display: grid;
    }
    
    .emoji-button {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 24px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      box-shadow: 0 1px 2px var(--shadow-color);
    }
    
    .emoji-button:hover {
      background-color: var(--hover-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px var(--shadow-color);
    }
    
    .emoji-button:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.3);
    }
    
    .footer {
      padding: 12px 16px;
      font-size: 12px;
      color: #888;
      text-align: center;
      border-top: 1px solid var(--border-color);
    }
    
    .footer-text {
      margin-bottom: 8px;
    }
    
    .coffee-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    
    .coffee-link:hover {
      color: #1976d2;
      text-decoration: underline;
    }

    .error-container {
      display: none;
      text-align: center;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      padding: 0 24px;
      box-sizing: border-box;
    }

    .error-container.visible {
      display: block;
    }

    .error-icon {
      font-size: 32px;
      color: var(--error-color);
      margin-bottom: 12px;
    }

    .error-title {
      color: var(--error-color);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .error-message {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }

    .loading-container {
      display: none;
      text-align: center;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
    }

    .loading-container.visible {
      display: block;
    }

    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="header-icon">✨</span>
      <h1 class="header-title">AI Emoji Suggester for Notion</h1>
    </div>
    <div class="content">
      <div class="loading-container visible">
        <div class="loading-spinner"></div>
        <div class="loading-text">Finding perfect emojis...</div>
      </div>
      <div class="error-container">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Not a Notion Page</div>
        <div class="error-message">
          This extension only works on Notion pages.<br>
          Please navigate to a Notion page and try again.
        </div>
      </div>
      <div class="emoji-grid"></div>
    </div>
    <div class="footer">
      <div class="footer-text">Enhance your Notion pages with AI-powered emoji magic 🪄</div>
      <a href="https://buymeacoffee.com/amirzak" target="_blank" class="coffee-link">
        <span>☕</span>
        <span>Buy me a coffee</span>
      </a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
